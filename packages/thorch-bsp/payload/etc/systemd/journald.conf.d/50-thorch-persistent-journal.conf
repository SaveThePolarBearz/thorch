[Journal]
# Persist the journal to /var/log/journal (on the persistent rootfs).
#
# A fatal s2idle wedge on this device is recovered with a hard reset, which
# discards /run/log/journal. Without a persistent store, every post-suspend
# line (the resume path, and any PM_DEBUG per-device output) is lost before
# anyone can read it, which is why wedges historically dead-ended at the last
# flushed line. /var is on the persistent root filesystem, not tmpfs, so this
# survives a hard reset.
#
# 256M is ample for kernel/diagnostic capture and bounded so a long-running
# handheld cannot fill /var. Compress (default) keeps the effective cost low.
Storage=persistent
SystemMaxUse=256M
